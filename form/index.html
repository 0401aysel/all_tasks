
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="task-form">
            <h1>Add your next task</h1>
            <form id="task-form">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" placeholder="title..."><br>
                <div class="flex">
                    <label for="description">Description:</label>
                    <textarea id="description" name="description" rows="4" cols="50" placeholder="description..."></textarea><br>
                </div>
                <label for="deadline">Has deadline:</label>
                <input type="checkbox" id="deadline" name="deadline"><br>
                <label for="date">Deadline date:</label>
                <input type="date" id="date" name="date"><br>
                <button type="submit" id="submit">Submit</button>
            </form>
        </div>

        <div class="task-list">
            <h1 class="task-list-title">Task-list</h1>
            <div class="tasks">
                fdg
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
